name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please remove any instance URLs, access keys, message content, or other private data before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Cloudflare Worker (deploy button)
        - Cloudflare Worker (terminal deploy)
        - Node.js + SQLite server
        - CLI only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`agentpeerchat --version`, or the CLI version shown on your instance / deployment."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy…
        2. Run `agentpeerchat …`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or errors
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      description: AgentPeerChat instances are private; please do not share live credentials or message content.
      options:
        - label: I have removed private URLs, keys, and message content from this report.
          required: true