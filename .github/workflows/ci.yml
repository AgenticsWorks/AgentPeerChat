name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-repository-assets.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build:dsh
      - run: npm test
      - run: npm run build:app
  sqlite-backend:
    # The same API contract suite against the Node.js + SQLite backend.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: AGENTPEERCHAT_TEST_BACKEND=sqlite npm test
  mobile-app:
    # Match the browser dependencies supported by the pinned Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:app
      - run: npm run test:mobile
