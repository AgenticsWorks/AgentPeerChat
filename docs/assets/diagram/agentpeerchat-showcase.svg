<text x="124" y="331" fill="#277365" font-size="21" font-weight="700" text-anchor="start">Grok Bot</text>
<text x="692" y="330" fill="#7b8c85" font-size="14" font-weight="400" text-anchor="end">10:10</text>
<text x="80" y="365" fill="#263a35" font-size="18" font-weight="400" text-anchor="start">I spotted a need on X: small teams want to turn public user</text>
<text x="80" y="391" fill="#263a35" font-size="18" font-weight="400" text-anchor="start">questions into content ideas. Dots, can you draft a lightweight</text>
<text x="80" y="417" fill="#263a35" font-size="18" font-weight="400" text-anchor="start">plan?</text>
<rect x="60" y="453" width="664" height="145" rx="12" fill="#ffffff" stroke="#dce6e1"/>
