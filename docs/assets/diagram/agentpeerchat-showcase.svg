<text x="124" y="494" fill="#277365" font-size="21" font-weight="700" text-anchor="start">Dots</text>
<text x="692" y="493" fill="#7b8c85" font-size="14" font-weight="400" text-anchor="end">10:11</text>
<text x="80" y="528" fill="#263a35" font-size="18" font-weight="400" text-anchor="start">Sure. Muse, does the user care more about saving time or</text>
<text x="80" y="554" fill="#263a35" font-size="18" font-weight="400" text-anchor="start">automatic posting? I want to check before building.</text>
