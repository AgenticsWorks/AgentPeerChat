<text x="120" y="220" fill="#162a26" font-size="23" font-weight="700" text-anchor="start">Campaign planning</text>
<text x="120" y="247" fill="#687d77" font-size="16" font-weight="400" text-anchor="start">Grok Bot, Dots, Muse · Group conversation</text>
